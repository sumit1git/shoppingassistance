<html>
    <head>
        <title>Invite app</title>
        <style>
            button
            {
                background-color: rgb(165,152,111); /* Green */
                border: 2px solid black;
                color: white;
                padding: 10px ;
                width: 200px;
                margin-top:20px;
                font-size: 16px;
                cursor: pointer;
                border-radius: 10px;
                font-family: 'Courier New', Courier, monospace;
            }
            .outercontainer
            {
                max-width: 800px;
                margin: 0 auto;
                padding: 20px;
                border: 5px solid #ccc;
                border-radius: 50px;
            }
            .conversationcontainer
            {
                height: 500px;
                border: 5px solid #ccc;
                background-color: #f3f3f3;
                overflow-y: scroll;
                padding: 10px;
                border-radius: 50px;
            }
            #titlestyle
            {
                color: black;
                background-color: rgb(227,224,212);
                border: 2px solid black;
                padding: 10px;
                margin: 20px;
                border-radius: 10px;
            }
            #inputtextbox
            {
                width: 85%;
                padding: 10px;
                margin-top: 20px;
                border: 5px solid #ccc;
                background-color: #f3f3f3;
                border-radius: 10px;
            }
            #submitbutton
            {
                background-color: rgb(165,152,111); /* Green */
                border: 2px solid black;
                color: white;
                padding: 10px ;
                margin-top:20px;
                font-size: 16px;
                cursor: pointer;
                border-radius: 10px;
                font-family: 'Courier New', Courier, monospace;
            }
           .user
            {
               color: #ffffff;
               background-color: rgb(0,195,255);
               padding: 8px;
               border-radius: 10px;
               float:right;
               clear:both;
               max-width: 80%;
            }
            .bot
            {
               color: #ffffff;
               background-color: rgb(0,128,90);
               padding: 8px;
               border-radius: 10px;
               float:left;
               clear:both;
               max-width: 80%;
            }
            .center {
                display: flex;
                justify-content: center;
            }
            form {
                margin :10px
            }
            body {
                margin: 50px;
                font-family: 'Courier New', Courier, monospace;
            }
        </style>
    </head>
    <body>
        <div class="outercontainer">
            <div class="center">
             <h1 id="titlestyle">
                Invite App
             </h1>
            </div>
            <div class="conversationcontainer" id="chatcontainer">
                {% for entry in name_xyz %}
                <div class = "{% if entry.bot %}bot{% else %}user{% endif %}"> 
                    {% if entry.bot %}
                    {{ entry.bot }}
                    {% else %}
                    {{ entry.user }}
                    {% endif %}
                </div>
                {% endfor %}
            </div>

            <form action="/invite" method="POST" class="center">
                <input type="text" name="user_input_message" id="inputtextbox">
                <input type="submit" value="Submit" id="submitbutton">
            </form> 
            <form action="/end_conv" method="POST" class="center">
                <button type="submit">End Conversation</button>
            </form> 

        </div>
        <script>
            function scrollToBottom() {
                var chatcontainer = document.getElementById('chatcontainer');
                chatcontainer.scrollTop = chatcontainer.scrollHeight;
            }
            window.onload = scrollToBottom;
        </script>
    </body> 
</html>
